services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cobalt-backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - APP_ENV=development
      - DATABASE_URL=sqlite:///./data/cobalt.db
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=cobalt
      - KEYCLOAK_CLIENT_ID=cobalt-engine
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER}
      - LLM_MODEL=${LLM_MODEL}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - DEMO_MODE=false
    volumes:
      - backend-data:/app/data
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    user: "1000:1000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cobalt-frontend
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_KEYCLOAK_URL=http://localhost:8080
      - VITE_KEYCLOAK_REALM=cobalt
      - VITE_KEYCLOAK_CLIENT_ID=cobalt-engine
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    user: "1000:1000"

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: cobalt-keycloak
    command: start-dev --import-realm
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_HOSTNAME=localhost
      - KC_HOSTNAME_PORT=8080
      - KC_HOSTNAME_STRICT_HTTPS=false
      - KC_HTTP_ENABLED=true
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./backend/app/core/keycloak-realm.json:/opt/keycloak/data/import/realm.json:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    user: "1000:1000"

volumes:
  backend-data:
  keycloak-data: